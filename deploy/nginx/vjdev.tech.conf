server {
  listen 80;
  server_name www.vjdev.tech;
  return 301 https://vjdev.tech$request_uri;
}

server {
  listen 80;
  server_name vjdev.tech;
  root /var/www/vincent/portfolio/current;
  index index.html;
  error_page 404 /404.html;

  # /index.html et /projets/x/index.html : redirige vers l'URL propre (sinon le routeur client ne reconnaît pas le chemin)
  location ~ ^(.*/)index\.html$ {
    return 301 $1;
  }

  # HTML toujours revalidé : après un déploiement il doit pointer vers les nouveaux /assets/
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /captures/ {
    expires 30d;
  }
}
